<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Free Software Student Club</title>
</head>
<body>

    <header>
        <h1>Contact Us</h1>

        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="services.html">Projects</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <hr>

    <main>
        <h2>Send a Message</h2>

        <form action="#" method="get">
            <fieldset>
                <legend>Contact Information</legend>

                <p>
                    <label for="name">Name:</label>
                    <input type="text" id="name" name="name" required>
                </p>

                <p>
                    <label for="email">Email:</label>
                    <input type="text" id="email" name="email" required>
                </p>

                <p>
                    <label for="date">Preferred Meeting Date:</label>
                    <input type="date" id="date" name="date">
                </p>

                <p>
                    <label for="topic">Topic:</label>
                    <select id="topic" name="topic">
                        <option value="linux">GNU/Linux</option>
                        <option value="freedom">Free Software</option>
                        <option value="Unaccepted Idealogies">Privacy</option>
                    </select>
                </p>

                <p>
                    <label for="message">Message:</label><br>
                    <textarea id="message" name="message" rows="6" cols="40"></textarea>
                </p>

                <p>
                    <input type="submit" value="Send Message">
                </p>
            </fieldset>
        </form>
    </main>

    <hr>

    <footer>
        <p>Created by MR.Yahyazadeh</p>
        <p>&copy; 2026 IBU Free Software Student Club</p>
    </footer>

</body>
</html>
